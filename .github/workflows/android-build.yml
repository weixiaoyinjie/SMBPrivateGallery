name: Build SMB Private Gallery APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract v2.1 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f SMBPrivateGallery_v2.1_NoThumbnails_Source.zip
          mkdir -p build-source
          unzip -q -o SMBPrivateGallery_v2.1_NoThumbnails_Source.zip -d build-source
          test -f build-source/settings.gradle
          test -f build-source/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [[ ! -d "$SDK_ROOT/platforms/android-35" || ! -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v2.1 debug APK
        run: gradle --no-daemon --stacktrace -p build-source :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMBPrivateGallery-v2.1-debug-apk
          path: build-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
